name: Scraper Health & Autonomous Auto-Repair

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Scraper Tests
        id: run_tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" 2>&1 | tee test_output.log

      - name: Trigger Jules Self-Healing on Test Failure
        if: failure()
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python3 scripts/trigger_jules.py
